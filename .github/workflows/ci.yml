name: Website

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install Python test dependencies
        run: uv sync --extra dev
      - name: Test article examples
        run: uv run pytest
      - name: Setup Zine
        uses: kristoff-it/setup-zine@v2
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Test Markdown publishing
        run: zig build test
      - name: Generate social cards
        run: uv run scripts/cards.py
      - name: Export Markdown
        run: zig build publish
      - name: Build site
        run: zine release
      - name: Verify published HTML and Markdown
        run: zig build verify
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
