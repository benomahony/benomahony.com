<extend template="base.shtml">

<head id="head">
	<meta property="og:type" content="website">
	<link rel="alternate" type="application/rss+xml" title="Ben O'Mahony's blog" href="$page.alternative('rss').link()">
</head>

<main id="main">
	<header class="page-header">
		<h1 :text="$page.title"></h1>
		<div class="lede" :html="$page.content()"></div>
	</header>
	<section class="post-list" aria-label="Posts">
		<ctx :loop="$page.subpages()">
			<article>
				<time :text="$loop.it.date.format('2 January 2006')"></time>
				<h2><a href="$loop.it.link()" :text="$loop.it.title"></a></h2>
				<p :text="$loop.it.description"></p>
			</article>
		</ctx>
	</section>
</main>
