name: Links

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Zine
        uses: kristoff-it/setup-zine@v2
      - name: Build site
        run: zine release
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml --root-dir "${{ github.workspace }}/public" "public/**/*.html"
          fail: true
