<extend template="base.shtml">

<head id="head">
	<meta property="og:type" content="website">
	<link rel="alternate" type="application/rss+xml" title="Ben O'Mahony's blog" href="$page.alternative('rss').link()">
</head>

<main id="main">
	<header class="page-header">
		<h1 :text="$page.title"></h1>
		<div class="lede" :html="$page.content()"></div>
		<ul class="tag-list" aria-label="Topics">
			<ctx :loop="$site.page('topics').subpagesAlphabetic()">
				<li><a href="$loop.it.link()" :text="$loop.it.title"></a></li>
			</ctx>
		</ul>
	</header>
	<section class="post-list" aria-label="Posts">
		<ctx :loop="$page.subpages()">
			<article>
				<div class="post-list-meta">
					<time :text="$loop.it.date.format('2 January 2006')"></time>
					<ctx :if="$loop.it.custom.get?('publication')">
						<span aria-hidden="true">·</span>
						<span class="post-publication"><span :text="$if"></span> <span aria-hidden="true">↗</span></span>
					</ctx>
				</div>
				<h2><a href="$loop.it.custom.getOr('external_url', $loop.it.link())" :text="$loop.it.title"></a></h2>
				<p :text="$loop.it.description"></p>
				<ul class="tag-list" aria-label="Topics">
					<ctx :loop="$loop.it.tags">
						<li><a href="$site.page('topics', $loop.it).link()" :text="$site.page('topics', $loop.it).title"></a></li>
					</ctx>
				</ul>
			</article>
		</ctx>
	</section>
</main>
