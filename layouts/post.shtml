<extend template="base.shtml">

<head id="head">
	<meta property="og:type" content="article">
</head>

<main id="main">
	<div class="post-layout">
		<article>
			<header class="article-header">
				<p class="eyebrow"><a href="$site.page('blog').link()">Blog</a></p>
				<h1 :text="$page.title"></h1>
				<p class="article-meta">
					<time :text="$page.date.format('2 January 2006')"></time>
					<span aria-hidden="true"> · </span>
					<span :text="$page.authors.join(', ')"></span>
				</p>
				<ul class="tag-list" aria-label="Topics">
					<ctx :loop="$page.tags">
						<li><a href="$site.page('topics', $loop.it).link()" :text="$site.page('topics', $loop.it).title"></a></li>
					</ctx>
				</ul>
			</header>
			<div class="prose" :html="$page.content()"></div>
		</article>
		<aside class="article-toc">
			<p class="article-toc-title">On this page</p>
			<nav aria-label="Table of contents" :html="$page.toc()"></nav>
		</aside>
	</div>
	<ctx :if="$page.custom.get?('related')">
		<section class="related-posts" aria-labelledby="related-heading">
			<h2 id="related-heading" class="eyebrow">Read next</h2>
			<div class="home-post-grid">
				<ctx :loop="$if">
					<ctx post="$site.page($loop.it)">
						<article>
							<div class="post-list-meta">
								<time :text="$ctx.post.date.format('2 January 2006')"></time>
								<ctx :if="$ctx.post.custom.get?('publication')">
									<span aria-hidden="true">·</span>
									<span class="post-publication"><span :text="$if"></span> <span aria-hidden="true">↗</span></span>
								</ctx>
							</div>
							<h3><a href="$ctx.post.custom.getOr('external_url', $ctx.post.link())" :text="$ctx.post.title"></a></h3>
							<p :text="$ctx.post.description"></p>
						</article>
					</ctx>
				</ctx>
			</div>
		</section>
	</ctx>
</main>
