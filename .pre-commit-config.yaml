repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: publish-date
        name: set date on newly published posts
        entry: uv run scripts/publish_date.py
        language: system
        files: ^content/blog/.*\.smd$

      - id: test-blog-examples
        name: test blog examples
        entry: uv run pytest tests/test_blog_examples.py --examples-only
        language: system
        files: ^content/blog/.*\.smd$
        pass_filenames: false
