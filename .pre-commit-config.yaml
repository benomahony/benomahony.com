repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: test-blog-examples
        name: test blog examples
        entry: uv run pytest tests/test_blog_examples.py --examples-only
        language: system
        files: ^content/blog/.*\.smd$
        pass_filenames: false

      - id: search-index-covers-videos
        name: search index covers linked videos
        entry: uv run pytest tests/test_search_index.py
        language: system
        files: ^(content/.*\.smd|layouts/.*|assets/search-index\.json)$
        pass_filenames: false
