name: Links

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Zine
        uses: kristoff-it/setup-zine@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Generate social cards
        run: uv run scripts/cards.py
      - name: Export Markdown
        run: zig build publish
      - name: Build site
        run: zine release
      - name: Verify published HTML and Markdown
        run: zig build verify
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml --root-dir "${{ github.workspace }}/public" --remap "^https://benomahony\.com/(.*)$ file://${{ github.workspace }}/public/\$1" "public/**/*.html"
          fail: true
