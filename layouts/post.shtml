<extend template="base.shtml">

<head id="head">
	<meta property="og:type" content="article">
</head>

<main id="main">
	<div class="post-layout">
		<article>
			<header class="article-header">
				<p class="eyebrow"><a href="$site.page('blog').link()">Blog</a></p>
				<h1 :text="$page.title"></h1>
				<p class="article-meta">
					<time :text="$page.date.format('2 January 2006')"></time>
					<span aria-hidden="true"> · </span>
					<span :text="$page.authors.join(', ')"></span>
				</p>
				<ul class="tag-list" aria-label="Topics">
					<ctx :loop="$page.tags">
						<li><a href="$site.page('topics', $loop.it).link()" :text="$site.page('topics', $loop.it).title"></a></li>
					</ctx>
				</ul>
			</header>
			<div class="prose" :html="$page.content()"></div>
			<ctx :if="$page.footnotes?()">
				<section class="footnotes" aria-labelledby="notes-heading">
					<h2 id="notes-heading" class="eyebrow">Notes</h2>
					<ol>
						<ctx :loop="$if">
							<li id="$loop.it.def_id">
								<ctx :html="$loop.it.html()"></ctx>
								<ctx :loop="$loop.it.ref_ids">
									<a class="footnote-backref" href="$loop.it.prefix('#')" aria-label="Back to text">↩</a>
								</ctx>
							</li>
						</ctx>
					</ol>
				</section>
			</ctx>
			<section class="subscribe" aria-labelledby="subscribe-heading">
				<h2 id="subscribe-heading">Follow along</h2>
				<p>New posts by email, videos on YouTube, and shorter takes on LinkedIn.</p>
				<div class="subscribe-row">
					<form class="subscribe-form" action="https://app.kit.com/forms/7530505/subscriptions" method="post">
						<input type="email" name="email_address" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
						<input type="hidden" name="referrer" value="$site.host_url.addPath($page.link())">
						<button class="badge-button" type="submit">
							<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="4" fill="#4F46E5"/><path d="M6 8.5h14v9H6z" fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 8.5l7 5.25 7-5.25" fill="none" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg>
							<span><small>Subscribe to the</small><strong>Newsletter</strong></span>
						</button>
					</form>
					<div class="subscribe-badges">
						<a class="badge-link" href="$site.page('go/youtube').link()" target="_blank" rel="noreferrer">
							<img class="youtube-badge youtube-badge-light" src="$site.asset('youtube-black.svg').link()" alt="Subscribe on YouTube">
							<img class="youtube-badge youtube-badge-dark" src="$site.asset('youtube-white.svg').link()" alt="Subscribe on YouTube">
						</a>
						<a class="badge-link" href="$site.page('go/linkedin').link()" target="_blank" rel="noreferrer">
							<img class="youtube-badge youtube-badge-light" src="$site.asset('linkedin-black.svg').link()" alt="Follow on LinkedIn">
							<img class="youtube-badge youtube-badge-dark" src="$site.asset('linkedin-white.svg').link()" alt="Follow on LinkedIn">
						</a>
					</div>
				</div>
			</section>
		</article>
		<aside class="article-toc">
			<p class="article-toc-title">On this page</p>
			<nav aria-label="Table of contents" :html="$page.toc()"></nav>
		</aside>
	</div>
	<ctx :if="$page.custom.get?('related')">
		<section class="related-posts" aria-labelledby="related-heading">
			<h2 id="related-heading" class="eyebrow">Read next</h2>
			<div class="home-post-grid">
				<ctx :loop="$if">
					<ctx post="$site.page($loop.it)">
						<article>
							<div class="post-list-meta">
								<time :text="$ctx.post.date.format('2 January 2006')"></time>
								<ctx :if="$ctx.post.custom.get?('publication')">
									<span aria-hidden="true">·</span>
									<span class="post-publication"><span :text="$if"></span> <span aria-hidden="true">↗</span></span>
								</ctx>
							</div>
							<h3><a href="$ctx.post.custom.getOr('external_url', $ctx.post.link())" :text="$ctx.post.title"></a></h3>
							<p :text="$ctx.post.description"></p>
						</article>
					</ctx>
				</ctx>
			</div>
		</section>
	</ctx>
</main>
