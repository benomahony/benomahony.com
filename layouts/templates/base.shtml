<!doctype html>
<html lang="en-GB">
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="$page.description">
		<meta name="author" content="Ben O'Mahony">
		<meta property="og:title" content="$page.title">
		<meta property="og:description" content="$page.description">
		<meta property="og:url" content="$site.host_url.addPath($page.link())">
		<meta property="og:site_name" content="Ben O'Mahony">
		<ctx :if="$page.custom.get?('og_image')">
			<meta property="og:image" content="$site.host_url.addPath($page.asset($if).link())">
			<meta name="twitter:card" content="summary_large_image">
		</ctx>
		<ctx :if="$page.custom.has('og_image').not()">
			<meta property="og:image" content="$site.host_url.addPath($site.asset('headshot.jpg').link())">
			<meta name="twitter:card" content="summary">
		</ctx>
		<link rel="icon" href="$site.asset('favicon.svg').link()" type="image/svg+xml">
		<title :text="$page.title"></title>
		<link rel="stylesheet" href="$site.asset('style.css').link()">
		<link rel="stylesheet" href="$site.asset('highlight.css').link()">
		<ctx :if="$build.development.not()">
			<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "988f677f6e2648de97706e912e4dc396"}'></script>
		</ctx>
		<super>
	</head>
	<body id="body">
		<header class="site-header">
			<a class="site-name" href="$site.page('').link()">Ben O'Mahony</a>
			<nav aria-label="Primary navigation">
				<a href="$site.page('book').link()">Book</a>
				<a href="$site.page('courses').link()">Courses</a>
				<a href="$site.page('podcasts').link()">Podcasts</a>
				<a href="$site.page('talks').link()">Talks</a>
				<a href="$site.page('blog').link()">Blog</a>
			</nav>
		</header>
		<main id="main">
			<super>
		</main>
		<footer>
			<p>© <span :text="$build.generated.format('2006')"></span> Ben O'Mahony</p>
			<nav class="footer-links" aria-label="Elsewhere">
				<a href="https://github.com/benomahony">GitHub</a>
				<a href="https://www.youtube.com/show/VLPLcaGw9uXUqE4?sbp=Kgs5dUdSMFA0OHdHY0AB">YouTube</a>
				<a href="$site.page('blog').alternative('rss').link()">RSS</a>
			</nav>
		</footer>
	</body>
</html>
